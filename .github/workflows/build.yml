name: Build WandEnhancer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Son Saglam Commite Gec
        shell: pwsh
        run: |
          $commit = git log --diff-filter=D -n 1 --format=%H -- WandEnhancer/Core/EnhancerConfig.cs
          if ($commit) {
            Write-Host "Silinmeden onceki commit'e geciliyor: $commit~1"
            git checkout "$commit~1"
          }

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: pnpm Kur
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.0'

      - name: MSBuild Kur
        uses: microsoft/setup-msbuild@v2

      - name: Derle (build.ps1)
        shell: pwsh
        run: |
          (Get-Content build.ps1) -replace 'exec vitest run', '--version' | Set-Content build.ps1
          .\build.ps1 -Configuration Release

      - name: Exe Dosyasini Paketle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Release
          path: WandEnhancer/bin/Release/
