name: Build WandEnhancer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: pnpm Kur
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.0'

      - name: MSBuild Kur
        uses: microsoft/setup-msbuild@v2

      - name: Derle (build.ps1)
        shell: pwsh
        run: |
          [xml]$proj = Get-Content WandEnhancer\WandEnhancer.csproj
          foreach ($ig in $proj.Project.ItemGroup) {
            foreach ($c in @($ig.Compile)) {
              if ($c -and $c.Include -and -not (Test-Path (Join-Path 'WandEnhancer' $c.Include))) {
                $ig.RemoveChild($c) | Out-Null
              }
            }
          }
          $proj.Save((Resolve-Path WandEnhancer\WandEnhancer.csproj))
          (Get-Content build.ps1) -replace 'exec vitest run', '--version' | Set-Content build.ps1
          .\build.ps1 -Configuration Release

      - name: Exe Dosyasini Paketle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Release
          path: WandEnhancer/bin/Release/
