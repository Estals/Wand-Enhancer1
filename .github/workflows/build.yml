name: Build WandEnhancer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Son Saglam Surume Gec
        shell: pwsh
        run: |
          $tag = git tag --sort=-v:refname | Select-Object -First 1
          if ($tag) {
            Write-Host "Son surum etiketine geciliyor: $tag"
            git checkout $tag
          } else {
            $commit = git rev-list -n 1 HEAD -- WandEnhancer/Core/EnhancerConfig.cs
            Write-Host "Son saglam commit'e geciliyor: $commit"
            git checkout $commit
          }

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: pnpm Kur
        uses: pnpm/action-setup@v4
        with:
          version: '10.17.0'

      - name: MSBuild Kur
        uses: microsoft/setup-msbuild@v2

      - name: Derle (build.ps1)
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Exe Dosyasini Paketle
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Release
          path: WandEnhancer/bin/Release/
